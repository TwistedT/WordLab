:root{--touch-target:48px}
.launch-setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:24px;padding:26px;margin:0 0 32px;border:1px solid var(--edge);border-radius:16px;background:#141e31}
.launch-setup fieldset{min-width:0;margin:0;padding:0;border:0}
.launch-setup legend{font-weight:650;font-size:1.05rem;margin-bottom:10px}
.set-checklist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.set-option,.difficulty-option{display:flex;align-items:center;gap:10px;min-height:48px;padding:9px 12px;border:1px solid var(--edge);border-radius:8px;cursor:pointer;font-size:.85rem}
.set-option:has(input:checked),.difficulty-option:has(input:checked){background:rgba(var(--accent-rgb),.08);border-color:var(--accent)}
.launch-setup input{width:18px;height:18px;min-height:18px;margin:0;accent-color:var(--accent);flex-shrink:0;padding:0}
.set-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
#set-summary{margin:12px 0 0}
.difficulty-options{display:grid;gap:10px}
.difficulty-option small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
[data-game-link][aria-disabled=true]{opacity:.5;cursor:not-allowed}
.phonetics{flex-wrap:wrap}
@media(max-width:1150px){.launch-setup{grid-template-columns:1fr}.difficulty-options{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){.launch-setup{padding:20px 16px;gap:26px}.set-checklist{grid-template-columns:repeat(3,minmax(0,1fr))}.set-option{padding:8px;font-size:.8rem;gap:7px}.difficulty-options{grid-template-columns:1fr}.difficulty-option small{display:inline;margin-left:10px}}
.cut{width:48px;min-width:48px;min-height:56px}
.cut.on::after{left:23px}
@media(max-width:580px){

  .keyboard-row{display:contents}
  .key,.key.wide{max-width:none;width:100%;min-height:var(--touch-target)}
  .cut{min-width:48px;width:48px}
  .cut.on::after{left:23px}
}
@media(max-width:350px){.keyboard{grid-template-columns:repeat(4,minmax(48px,1fr))}}
.story-link{display:inline-block;margin-left:14px;font-size:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.story-link:hover,.story-back:hover{color:var(--accent)}
.story-back{display:inline-flex;align-items:center;gap:8px;min-height:48px}
.story-body .main{margin-top:0;min-width:0}
.story-page{max-width:1000px;margin:0 auto;overflow-wrap:anywhere}
.story-hero{padding:58px 0 26px}
.story-hero h1{margin-bottom:18px}
.story-hero p{color:var(--muted);font-size:1.1rem;max-width:650px}
.story-contents{display:flex;gap:8px 24px;flex-wrap:wrap;padding:18px 0 26px;margin-bottom:16px;border-bottom:1px solid var(--edge);font-size:.85rem}
.story-contents a{display:inline-flex;align-items:center;min-height:48px;color:var(--accent);text-decoration:underline;text-underline-offset:5px}
.story-section{padding:32px;margin:0 0 24px;background:#151f33;border:1px solid var(--edge);border-radius:16px;scroll-margin-top:24px}
.story-section h2{font-size:2rem;margin-bottom:22px}
.story-section p,.story-section li{line-height:1.85;color:var(--muted)}
.story-section p:last-child{margin-bottom:0}
.story-section strong{color:var(--ink);font-weight:600}
.story-section a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.story-section ul,.story-section ol{padding-left:25px;margin:16px 0 24px}
.story-section li{padding-left:4px;margin:9px 0}
.story-document{font-size:.94rem}
.story-document h3{font-size:1.45rem;line-height:1.4;letter-spacing:-.025em;margin:32px 0 22px}
.story-document h3:first-child{margin-top:8px}
.story-document h4{font-size:1.2rem;line-height:1.45;letter-spacing:-.015em;margin:32px 0 15px}
.story-document h5,.story-document h6{font-size:1rem;line-height:1.5;margin:26px 0 14px}
.story-document hr{border:0;border-top:1px solid var(--edge);margin:32px 0}
.story-document blockquote{margin:24px 0;padding:4px 0 4px 20px;border-left:3px solid var(--accent)}
.story-document pre{max-width:100%;overflow:auto;padding:20px;background:#101a2b;border:1px solid var(--edge);border-radius:10px;line-height:1.65;white-space:pre;overflow-wrap:normal;font-size:.8rem}
.story-document code{font-family:ui-monospace,Consolas,monospace;color:#cfe7b7}
.story-document :not(pre)>code{font-size:.9em;background:#101a2b;border-radius:4px;padding:2px 5px}
.story-table{overflow:auto;max-width:100%;margin:24px 0;border:1px solid var(--edge);border-radius:10px}
.story-table table{width:100%;min-width:640px;border-collapse:collapse;font-size:.83rem;line-height:1.7}
.story-table th,.story-table td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--edge);min-width:140px}
.story-table th{color:var(--ink);background:#1c2a3f;font-weight:600}
.story-table td{color:var(--muted)}
.story-table tr:last-child td{border-bottom:0}
.math{white-space:nowrap;font-family:ui-serif,Georgia,serif;font-style:italic}
.story-license{margin-top:26px;padding-top:24px;border-top:1px solid var(--edge);font-size:.86rem}
.story-license h3{font-size:1.2rem}
@media(max-width:580px){.story-hero{padding-top:36px}.story-hero h1{font-size:3rem}.story-hero p{font-size:1rem}.story-section{padding:24px 18px}.story-section h2{font-size:1.7rem}.story-contents{gap:0 18px}.story-document h3{font-size:1.3rem}.story-document pre{padding:14px}.story-link{margin-left:8px}}

        row.push(field); if (row.some(x => x.trim())) rows.push(row); row = []; field = '';

    const tile = event.target.closest('[data-tile]'), cut = event.target.closest('[data-cut]');
    if(tile && !tile.disabled) { selectedTile = Number(tile.dataset.tile); drag = {kind:'tile',x:event.clientX,y:event.clientY,moved:false}; tile.setPointerCapture(event.pointerId); }
    else if(cut) {drag = {kind:'cut',visited:new Set([cut.dataset.cut]),x:event.clientX,y:event.clientY,moved:false}; cut.setPointerCapture(event.pointerId);}
  });
  document.addEventListener('pointermove',event => {
    if(!drag) return;
    if(Math.hypot(event.clientX-drag.x,event.clientY-drag.y)>8) drag.moved = true;
    if(!drag.moved) return;
    if(drag.kind === 'tile') $(`[data-tile="${selectedTile}"]`)?.classList.add('selected');
    else { const cut = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-cut]'); if(cut && !drag.visited.has(cut.dataset.cut)) { if(drag.visited.size === 1) toggleCut(Number([...drag.visited][0])); drag.visited.add(cut.dataset.cut); toggleCut(Number(cut.dataset.cut)); } }
  });
  document.addEventListener('pointerup',event => {
    if(!drag) return;
    if(drag.moved && drag.kind === 'tile') {const slot = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-slot]'); if(slot) placeTile(selectedTile,Number(slot.dataset.slot)); else $(`[data-tile="${selectedTile}"]`)?.classList.remove('selected');}
    setTimeout(() => {drag = null; selectedTile = null;},0);
  });
  document.addEventListener('pointercancel',() => {drag = null; selectedTile = null; $('.tile.selected')?.classList.remove('selected');});
  document.addEventListener('visibilitychange',() => {if(document.hidden) pauseTimer(); else resumeTimer();});
  initialize();
})();
</script></body></html>
